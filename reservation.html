<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />

    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />

  <meta property="og:url" content="https://theskypoolvilla.co.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 `reservation.html`. 원본 클래스 `sub4_1 sub_reserve` 를 그대로 쓴다. -->
        <section id="content" class="sub4_1 sub_reserve">
          <!-- ── 히어로 ──────────────────────────────────────
               원본이 `.sub_visual`(500px 단일 배경)이다. 슬라이더가 아니다. -->
          <div class="sub_visual" data-reservation-hero>
            <div class="txt_box">
              <h3>RESERVATION</h3>
              <p data-reservation-visual-description></p>
            </div>
          </div>

          <!-- 원본 탭은 이 페이지 하나뿐이다(`이용안내`). 그대로 둔다. -->
          <div class="sub_cate_wrap">
            <div class="inner">
              <ul>
                <li class="on"><a href="./reservation.html">이용안내</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont inner">
            <div class="title_box">
              <span>RESERVATION</span>
              <h3 data-reservation-title></h3>
              <p data-reservation-description></p>
            </div>

            <!-- ── 이용안내 / 환불정보 ───────────────────────
                 원본은 dt/dd 두 쌍 고정이다(`이용안내` / `환불정보`).
                 본문은 property 에서 온다 — 배정할 customFields 블록이 없다. -->
            <dl class="info_box">
              <dt>이용안내</dt>
              <dd data-reservation-info-body></dd>
              <dt data-reservation-refund-title>환불정보</dt>
              <dd data-reservation-refund-body></dd>
            </dl>
          </div>
          <!--// sub_cont -->
        </section>
      </div>
      <!--// container -->

      <div id="footer-wrap"></div>
    </div>

    <div id="popup-container"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/reservation-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
