<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>순천 더스카이풀빌라</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="순천 더스카이풀빌라" />
  <meta property="og:description" content="순천 더스카이풀빌라에서 온수수영장과 스파, 바베큐장을 즐기며 커플·가족·단체 모두 프라이빗한 풀빌라에서 특별한 하루를 완성해보세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/01/21/D8mINs4nYa6d.jpg" />
  <meta property="og:url" content="https://theskypoolvilla.co.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="순천 더스카이풀빌라" />
  <meta name="twitter:description" content="순천 더스카이풀빌라에서 온수수영장과 스파, 바베큐장을 즐기며 커플·가족·단체 모두 프라이빗한 풀빌라에서 특별한 하루를 완성해보세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/01/21/D8mINs4nYa6d.jpg" />
  <meta name="naver-site-verification" content="e1cbdd4b71d0cd19313461aeb869dbe00d13283c" />
  <meta name="google-site-verification" content="EJqy50yt7r48r5oFx7jmvX37YGvTO1_W5L-RTB8eXOI" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 `room.html`(객실 목록). 원본 클래스 `sub2_1 sub_room` 을 그대로 쓴다. -->
        <section id="content" class="sub2_1 sub_room">
          <!-- ── 히어로 ──────────────────────────────────────
               원본이 `.sub_visual`(500px 단일 배경)이다. 슬라이더가 아니다. -->
          <div class="sub_visual" data-layoutmap-hero>
            <div class="txt_box">
              <h3>ROOMS PREVIEW</h3>
              <p data-layoutmap-visual-description></p>
            </div>
          </div>

          <!-- ── 객실 탭 ─────────────────────────────────────
               첫 li("미리보기")는 고정이고 그 뒤를 매퍼가 만든다.
               roomtypes[].groupName 이 있으면 그룹명으로 접힌 목록이다. -->
          <div class="sub_cate_wrap">
            <div class="inner">
              <ul data-layoutmap-room-nav>
                <li class="on"><a href="./layout-map.html">미리보기</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont inner">
            <div class="main_room">
              <div class="title_box inner">
                <span>ROOMS PREVIEW</span>
                <h3 data-layoutmap-title></h3>
                <p data-layoutmap-description></p>
              </div>
              <div class="room_list">
                <div class="arw">
                  <div class="swiper-button-prev">
                    <img src="images/common/room_prev.png" alt="prev" />
                  </div>
                  <div class="swiper-button-next">
                    <img src="images/common/room_next.png" alt="next" />
                  </div>
                </div>
                <div class="inner">
                  <div class="swiper-container">
                    <div class="swiper-wrapper" data-layoutmap-room-slides></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- ── 배치도 ────────────────────────────────────
                 원본은 `<img src="room/layout.webp">` 한 장이지만, 숙소에 따라
                 동/층별로 여러 장을 올린다. 매퍼가 순서대로 세로로 쌓는다. -->
            <div class="layout_img" data-layoutmap-images></div>
          </div>
        </section>
      </div>
      <!--// container -->

      <div id="footer-wrap"></div>
    </div>

    <div id="popup-container"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/layout-map-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/layout-map.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
